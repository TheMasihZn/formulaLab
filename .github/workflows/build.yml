name: build

on:
  push:
    branches: ['**']
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Name APK
        run: cp app/build/outputs/apk/debug/app-debug.apk formulaLab-${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: formulaLab-${{ github.run_number }}
          path: formulaLab-${{ github.run_number }}.apk

      - name: Release (main only)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: formulaLab ${{ github.run_number }}
          files: formulaLab-${{ github.run_number }}.apk
