plugins {
    id 'com.android.application'
}

def runNumber = Integer.parseInt(System.getenv("GITHUB_RUN_NUMBER") ?: "1")

android {
    namespace 'com.themasihzn.formulalab'
    compileSdk 34

    defaultConfig {
        applicationId 'com.themasihzn.formulalab'
        minSdk 29
        targetSdk 34
        versionCode runNumber
        versionName "0.1." + runNumber
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
